# Build manifest — replayed by the netlinux dev pipeline.
# Not auto-triggered in GHA; use `gh workflow run release-deb.yml` to
# run manually on a GitHub-hosted runner.
name: Build .deb package (dual-suite)
true:
  push:
    branches:
    - master
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: bookworm
          container: debian:bookworm
        - target: resolute
          container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    steps:
    - name: Bootstrap container
      run: "apt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git xz-utils zstd \\\n \
        \ build-essential dpkg-dev sudo\n"
    - uses: actions/checkout@v4
    - name: Free disk space
      run: "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \\\n  /usr/local/share/boost /opt/hostedtoolcache\napt-get\
        \ clean\ndf -h /\n"
    - name: Install build dependencies
      run: "apt-get update\napt-get install -y \\\n  build-essential bc bison flex libelf-dev libssl-dev \\\n  dwarves debhelper\
        \ rsync cpio kmod libdw-dev\n"
    - name: Build kernel .deb packages
      run: 'make defconfig


        # Enable filesystems required for live-boot (squashfs + overlay)

        ./scripts/config --enable CONFIG_SQUASHFS

        ./scripts/config --enable CONFIG_SQUASHFS_XZ

        ./scripts/config --enable CONFIG_SQUASHFS_ZLIB

        ./scripts/config --enable CONFIG_SQUASHFS_LZO

        ./scripts/config --enable CONFIG_SQUASHFS_ZSTD

        ./scripts/config --enable CONFIG_OVERLAY_FS

        ./scripts/config --enable CONFIG_FUSE_FS

        ./scripts/config --enable CONFIG_CUSE


        make olddefconfig

        make -j$(nproc) bindeb-pkg

        mkdir -p debs

        mv ../*.deb debs/

        ls -lh debs/

        '
    - name: Determine version
      id: version
      run: 'DEB=$(ls debs/linux-image-*.deb | head -1)

        version=$(dpkg-deb -f "$DEB" Version)

        echo "version=${version}" >> "$GITHUB_OUTPUT"

        echo "tag=v${version}" >> "$GITHUB_OUTPUT"

        '
    - name: Repack .debs for reprepro compatibility
      run: "for DEB_PATH in debs/*.deb; do\n  if ar t \"$DEB_PATH\" | grep -q '\\.zst'; then\n    echo \"Repacking $(basename\
        \ \"$DEB_PATH\") from zstd to xz...\"\n    TMPDIR=$(mktemp -d)\n    cd \"$TMPDIR\"\n    ar x \"$GITHUB_WORKSPACE/$DEB_PATH\"\
        \n    for f in *.zst; do\n      [ -f \"$f\" ] || continue\n      zstd -d \"$f\"\n      xz \"${f%.zst}\"\n      rm\
        \ \"$f\"\n    done\n    rm \"$GITHUB_WORKSPACE/$DEB_PATH\"\n    ar rcs \"$GITHUB_WORKSPACE/$DEB_PATH\" debian-binary\
        \ control.tar.xz data.tar.xz\n    cd \"$GITHUB_WORKSPACE\"\n    rm -rf \"$TMPDIR\"\n  fi\ndone\nls -lh debs/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.target }}
        path: '**/*.deb

          '
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Compute tag
      id: tag
      run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ github.run_number }} (bookworm + resolute)
        body: 'Dual-suite build from commit ${{ github.sha }}.

          Both ~bookworm1 and ~resolute1 .debs are attached.

          '
        files: artifacts/**/*.deb
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Notify package repository
      run: "sleep 5\nPAYLOAD='{\"repo\":\"netlinux-ai/linux\",\"tag\":\"${{ steps.tag.outputs.tag }}\"}'\nSIGNATURE=$(echo\
        \ -n \"$PAYLOAD\" \\\n  | openssl dgst -sha256 -hmac \"${{ secrets.WEBHOOK_SECRET }}\" -binary \\\n  | xxd -p -c 256)\n\
        curl -sf -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Webhook-Signature: sha256=${SIGNATURE}\"\
        \ \\\n  -d \"$PAYLOAD\" \\\n  https://packages.netlinux.co.uk/webhook/update-repo\n"
'on':
  workflow_dispatch: null
